syntax = "proto3";

package grpc.health.v1;

// The standard gRPC Health Checking Protocol (https://github.com/grpc/grpc/blob/master/doc/health-checking.md).
// Kept byte-identical to the canonical proto so any standard health-checking client (including
// AWS ALB's `backend-protocol-version: GRPC` target group health check) can call it unmodified.

message HealthCheckRequest {
  string service = 1;
}

message HealthCheckResponse {
  enum ServingStatus {
    UNKNOWN = 0;
    SERVING = 1;
    NOT_SERVING = 2;
    SERVICE_UNKNOWN = 3;
  }
  ServingStatus status = 1;
}

service Health {
  rpc Check(HealthCheckRequest) returns (HealthCheckResponse);
  rpc Watch(HealthCheckRequest) returns (stream HealthCheckResponse);
}
