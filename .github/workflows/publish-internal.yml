# Builds a single adapter from the current branch and pushes it to the private
# ECR, so an unreleased change can be referenced from infra-k8s.
#
# The regular path to a private image is deploy.yml, which only fires on a push
# to main that touches MASTERLIST.md — that is, on a release. This workflow
# fills the gap for testing a change before it is released.
#
# It deliberately does NOT tag `latest` and does NOT notify infra-k8s. Images
# land under a `-dev.<sha>` tag that cannot collide with a release tag, and
# referencing one is a manual step in infra-k8s.
name: Publish Internal Adapter Image

on:
  workflow_dispatch:
    inputs:
      adapter:
        description: Adapter short name, as used in the ECR repo (e.g. "gsr")
        required: true
        type: string
      image-tag:
        description: Overrides the default "<version>-dev.<short-sha>" tag. Must not be a released version or "latest".
        required: false
        type: string

# Shares the deploy-and-release group so an internal build cannot race a release
# that is pushing to the same repository.
concurrency:
  group: deploy-and-release
  cancel-in-progress: false

jobs:
  resolve-adapter:
    name: Resolve ${{ inputs.adapter }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      package-name: ${{ steps.resolve.outputs.PACKAGE_NAME }}
      location: ${{ steps.resolve.outputs.LOCATION }}
      image-tag: ${{ steps.resolve.outputs.IMAGE_TAG }}
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - name: Set up and install dependencies
        uses: ./.github/actions/setup
        with:
          skip-setup: true
      - name: Resolve adapter workspace and image tag
        id: resolve
        env:
          ADAPTER: ${{ inputs.adapter }}
          TAG_OVERRIDE: ${{ inputs.image-tag }}
        run: |
          set -euo pipefail

          package_name="@chainlink/${ADAPTER}-adapter"
          location=$(yarn workspaces list --json \
            | jq -rc --arg n "$package_name" 'select(.name == $n) | .location')

          if [ -z "$location" ]; then
            echo "::error::No workspace named ${package_name}. Pass the adapter short name, e.g. \"gsr\"."
            exit 1
          fi

          version=$(jq -r '.version' "${location}/package.json")

          if [ -n "$TAG_OVERRIDE" ]; then
            image_tag="$TAG_OVERRIDE"
            # A release build would overwrite these, so refuse them outright.
            if [ "$image_tag" = "latest" ] || [ "$image_tag" = "$version" ]; then
              echo "::error::Refusing to publish over the released tag \"${image_tag}\"."
              exit 1
            fi
          else
            image_tag="${version}-dev.${GITHUB_SHA::8}"
          fi

          # ECR tags are limited to this character set; fail early rather than
          # deep inside the build.
          if ! printf '%s' "$image_tag" | grep -qE '^[A-Za-z0-9][A-Za-z0-9._-]{0,127}$'; then
            echo "::error::\"${image_tag}\" is not a valid ECR tag."
            exit 1
          fi

          {
            echo "PACKAGE_NAME=${package_name}"
            echo "LOCATION=${location}"
            echo "IMAGE_TAG=${image_tag}"
          } >> "$GITHUB_OUTPUT"

          echo "Building ${package_name} from ${location} as ${image_tag}"

  create-ecr:
    name: Create ECR for ${{ inputs.adapter }}
    runs-on: ubuntu-latest
    needs: [resolve-adapter]
    permissions: # These are needed for the configure-aws-credentials action
      id-token: write
      contents: read
    environment: release
    env:
      ECR_URL: ${{ secrets.SDLC_ACCOUNT_ID }}.dkr.ecr.${{ secrets.AWS_REGION_ECR_PRIVATE }}.amazonaws.com
      ECR_REPO: adapters/${{ inputs.adapter }}-adapter
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - name: Create ECR for ${{ inputs.adapter }}
        uses: ./.github/actions/create-ecrs
        with:
          aws-ecr-url: ${{ env.ECR_URL }}
          aws-ecr-repo: ${{ env.ECR_REPO }}
          aws-region: ${{ secrets.AWS_REGION_ECR_PRIVATE }}
          aws-role: ${{ secrets.AWS_OIDC_IAM_ROLE_ARN }}
          aws-ecr-account-ids: ${{ secrets.AWS_PRIVATE_ECR_SECONDARY_ACCOUNT_ACCESS_IDS }}
          aws-ecr-private: true

  build-publish:
    name: Build and publish ${{ inputs.adapter }}
    permissions:
      contents: read
      id-token: write
    needs: [resolve-adapter, create-ecr]
    uses: smartcontractkit/.github/.github/workflows/reusable-docker-build-publish.yml@ce87497eb287565c796a8a781508be949f3ed1e2 # 2025-10-10
    with:
      aws-ecr-name: adapters/${{ inputs.adapter }}-adapter
      aws-region-ecr: us-west-2
      dockerfile: ./Dockerfile
      docker-build-args: |
        package=${{ needs.resolve-adapter.outputs.package-name }}
        location=${{ needs.resolve-adapter.outputs.location }}
      docker-build-context: .
      docker-image-tag-override: ${{ needs.resolve-adapter.outputs.image-tag }}
      # Intentionally no docker-manifest-additional-tags: tagging `latest` here
      # would repoint every consumer of the released image at an unreleased build.
      docker-push: true
      environment: release
      git-sha: ${{ github.sha }}
      github-event-name: ${{ github.event_name }}
      github-ref-name: ${{ github.ref_name }}
      github-ref-type: ${{ github.ref_type }}
      github-workflow-repository: ${{ github.repository }}
      github-runner-arm64: ubuntu-24.04-2cores-8GB-ARM
      github-runner-amd64: ubuntu-24.04
    secrets:
      AWS_ACCOUNT_ID: ${{ secrets.SDLC_ACCOUNT_ID }}
      AWS_ROLE_PUBLISH_ARN: ${{ secrets.AWS_OIDC_IAM_ROLE_ARN }}

  report-image:
    name: Report image reference
    runs-on: ubuntu-latest
    needs: [resolve-adapter, build-publish]
    permissions:
      contents: read
    steps:
      - name: Write image reference to the job summary
        env:
          ECR_REPO: adapters/${{ inputs.adapter }}-adapter
          IMAGE_TAG: ${{ needs.resolve-adapter.outputs.image-tag }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          {
            echo "### Internal image published"
            echo
            echo "| | |"
            echo "|---|---|"
            echo "| Repository | \`${ECR_REPO}\` |"
            echo "| Tag | \`${IMAGE_TAG}\` |"
            echo "| Branch | \`${REF_NAME}\` |"
            echo "| Commit | \`${GITHUB_SHA}\` |"
            echo
            echo "Reference it in infra-k8s against the same private ECR registry used by the"
            echo "release pipeline, i.e. \`<sdlc-account>.dkr.ecr.<region>.amazonaws.com/${ECR_REPO}:${IMAGE_TAG}\`."
            echo
            echo "This tag was not applied to \`latest\` and infra-k8s was not notified."
          } >> "$GITHUB_STEP_SUMMARY"
